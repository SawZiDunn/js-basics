<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #container {
            width: 500px;
        }

        .row {
            display: flex;
            justify-content: space-between;
        }

    </style>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            console.log("asfd");

            const addBtn = document.getElementById('add-btn');
            const resetBtn = document.getElementById('reset-btn');

            const clearBtn = document.getElementById('clear-btn');

            addBtn.addEventListener('click', (e) => {
                e.preventDefault();
                add();

            })

            resetBtn.addEventListener('click', (e) => {
                e.preventDefault();
                reset();
            });
            clearBtn.addEventListener('click', e => {
                e.preventDefault();
                clear();
            });



            function add(e) {
                
                const name = document.getElementById('name').value;
                const amount = document.getElementById('amount').value;
                const price = document.getElementById('price').value;

            
                let newDiv = document.createElement('div');

                let newNode = document.createElement('span');
                newNode.textContent = name;
                
                newDiv.appendChild(newNode);

                newNode = document.createElement('span');
                newNode.textContent = amount;
                newDiv.appendChild(newNode);

                newNode = document.createElement('span');
                newNode.textContent = price;
                newDiv.appendChild(newNode);

                newDiv.setAttribute('class', 'row new')

                document.getElementById('container').appendChild(newDiv);

            }

            function reset() {
                const allChildren = document.getElementById('container').querySelectorAll('*');
                const firstChild = Array.from(allChildren)[0];
                console.log('calling reset');
                document.getElementById('container').innerHTML = "";
                document.getElementById('container').appendChild(firstChild);
            }

            function clear() {
                document.getElementById('name').value = '';
                document.getElementById('amount').value = '';
                document.getElementById('price').value = '';
            }

        })

        
    </script>
</head>
<body>
    <div id="container">
        <div class="row">
            <h2>Item Name</h2>
            <h2>Amount</h2>
            <h2>Price</h2>
        </div>
        
    </div>

    <button id="reset-btn">Reset</button>

    <form>
        <h1>Add item</h1>
        <div>
            <span>Name: </span>
            <input type="text" id="name">
        </div>

        <div>
            <span>Amount: </span>
            <input type="text" id="amount">
        </div>

        <div>
            <span>Price: </span>
            <input type="text" id="price">
        </div>

        <button id="add-btn">Add</button>
        <button id="clear-btn">Clear</button>
    </form>
    
</body>
</html>
