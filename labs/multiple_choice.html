        <script>
            let counter = 0;
            let score = 0;

            // Set the question and answers to the HTML via DOM
            let questionElement = document.getElementById("question");
            let questionNumElement = document.getElementById("questionNum");
            let ans1Element = document.getElementById("ans1");
            let ans2Element = document.getElementById("ans2");
            let ans3Element = document.getElementById("ans3");
            let ans4Element = document.getElementById("ans4");
            let scoreElement = document.getElementById("score");
            let nextButton = document.getElementById("next");
            let correctMessage = document.getElementById("correct");
            let wrongMessage = document.getElementById("wrong");
            let explanationElement = document.getElementById("explanation");

            nextQuestion(); // Load the first question
            nextButton.addEventListener("click", nextQuestion);

            function nextQuestion() {
                ans1Element.addEventListener("click", evaluate);
                ans2Element.addEventListener("click", evaluate);
                ans3Element.addEventListener("click", evaluate);
                ans4Element.addEventListener("click", evaluate);

                let question = questions[counter];
                counter += 1;
                counter %= questions.length;

                if (counter === 5) {
                    nextButton.removeEventListener("click", nextQuestion);
                }

                // Update question and answers in the DOM
                questionElement.innerHTML = question.question;
                ans1Element.src = question.answer[0].pic;
                ans2Element.src = question.answer[1].pic;
                ans3Element.src = question.answer[2].pic;
                ans4Element.src = question.answer[3].pic;
                ans1Element.alt = question.answer[0].id;
                ans2Element.alt = question.answer[1].id;
                ans3Element.alt = question.answer[2].id;
                ans4Element.alt = question.answer[3].id;
                ans1Element.title = question.answer[0].id;
                ans2Element.title = question.answer[1].id;
                ans3Element.title = question.answer[2].id;
                ans4Element.title = question.answer[3].id;

                // Increment question number displayed
                questionNumElement.innerHTML = `Question ${counter}`;

                correctMessage.style.display = "none";
                wrongMessage.style.display = "none";
                explanationElement.style.display = "none";
            }

            function evaluate(e) {
                const ele = e.target;

                let currentQuestion = questions.find(
                    (q) => q.question === questionElement.innerHTML
                );
                let correctAnswer = currentQuestion.answer.find(
                    (a) => a.id === ele.title && a.correct
                );

                if (correctAnswer) {
                    score++;
                    scoreElement.innerHTML = score;
                    console.log("Score updated:", score);

                    correctMessage.style.display = "block";
                    wrongMessage.style.display = "none";
                    explanationElement.innerHTML = currentQuestion.explain;
                    explanationElement.style.display = "block";
                    setTimeout(() => {
                        if (counter !== 5) {
                            nextQuestion();
                        }
                    }, 1000);
                } else {
                    wrongMessage.style.display = "block";
                    correctMessage.style.display = "none";
                    explanationElement.innerHTML = currentQuestion.explain;
                    explanationElement.style.display = "block";

                    ans1Element.removeEventListener("click", evaluate);
                    ans2Element.removeEventListener("click", evaluate);
                    ans3Element.removeEventListener("click", evaluate);
                    ans4Element.removeEventListener("click", evaluate);
                }
            }

            ans1Element.addEventListener("click", evaluate);
            ans2Element.addEventListener("click", evaluate);
            ans3Element.addEventListener("click", evaluate);
            ans4Element.addEventListener("click", evaluate);
        </script>
